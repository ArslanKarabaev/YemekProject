{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'canteens/css/canteencss.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/965003a3ec.js" crossorigin="anonymous"></script>
</head>
<body>

<aside class="sidebar">
    <ul>
        <li class="{% if request.path == '/' %}active-home{% endif %}">
            <a href="{% url 'index' %}"><i class="fa-solid fa-house"></i></a>
        </li>
        <li class="{% if 'menu' in request.path %}active-canteen{% endif %}">
            <a href="{% url 'menu' %}"><i class="fa-solid fa-mug-saucer"></i></a>
        </li>
        <li class="{% if 'alternative' in request.path %}active-alt{% endif %}">
            <a href="{% url 'chernovik:places_map' %}"><i class="fa-solid fa-utensils"></i></a>
        </li>
        <li class="{% if 'user' in request.path %}active-user{% endif %}">
            <a href="{% url 'logout' %}"><i class="fa-solid fa-right-from-bracket"></i></a>
        </li>
    </ul>
</aside>

<main class="main">
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
